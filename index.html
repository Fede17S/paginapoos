<style>
/* ============================================================
   SISTEMA VISUAL — TOKENS Y BASE
   ============================================================ */
:root {
  --green-50:  #ECF6F0;
  --green-100: #D6ECE0;
  --green-200: #AFD9C3;
  --green-500: #25A36C;
  --green-600: #1F8A5B;
  --green-700: #176D49;
  --green-800: #115338;
  --bg:        #F4F6F5;
  --surface:   #FFFFFF;
  --surface-2: #FAFBFA;
  --ink:       #16201B;
  --ink-2:     #3C4842;
  --muted:     #6B7670;
  --muted-2:   #9AA39E;
  --line:      #E6EAE7;
  --line-2:    #EFF2F0;
  --danger:    #C8463B;
  --danger-bg: #FBECEA;
  --warn:      #B5780E;
  --warn-bg:   #FBF1DC;
  --info:      #2A6FDB;
  --info-bg:   #E8F0FC;
  --radius:    14px;
  --radius-sm: 10px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px rgba(22,32,27,.05), 0 1px 3px rgba(22,32,27,.04);
  --shadow:    0 2px 4px rgba(22,32,27,.04), 0 8px 24px rgba(22,32,27,.06);
  --shadow-lg: 0 12px 40px rgba(22,32,27,.16);
  --sidebar-w: 248px;
  --font: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
#root { height: 100vh; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }
:focus-visible { outline: 2px solid var(--green-600); outline-offset: 2px; }

/* ---------- Layout shell ---------- */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: var(--sidebar-w); flex: 0 0 var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 14px; }
.brand { display: flex; align-items: center; gap: 11px; padding: 8px 8px 18px; }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; flex: 0 0 38px; background: var(--green-600); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; box-shadow: 0 2px 8px rgba(31,138,91,.35); }
.brand-name { font-weight: 800; font-size: 15.5px; letter-spacing: -.2px; line-height: 1.15; margin-bottom: 1px; }
.brand-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.nav { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.nav-section { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--muted-2); padding: 14px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 11px; color: var(--ink-2); font-size: 14.5px; font-weight: 600; text-align: left; transition: background .12s, color .12s; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--green-50); color: var(--green-700); }
.nav-item svg { width: 20px; height: 20px; color: var(--muted); flex: 0 0 20px; }
.nav-item.active svg { color: var(--green-600); }
.nav-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 6px; }
.sidebar-foot { margin-top: auto; }
.user-chip { display: flex; align-items: center; gap: 11px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--green-100); color: var(--green-700); display: grid; place-items: center; font-weight: 700; flex: 0 0 36px; }
.user-name { font-weight: 700; font-size: 13.5px; }
.user-role { font-size: 11.5px; color: var(--muted); }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { height: 64px; flex: 0 0 64px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 28px; gap: 16px; }
.topbar h1 { font-size: 20px; font-weight: 800; letter-spacing: -.3px; margin: 0; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.clock { font-size: 13px; color: var(--muted); font-weight: 600; }
.session-pill { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--green-700); background: var(--green-50); padding: 7px 12px; border-radius: 999px; }
.session-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-500); box-shadow: 0 0 0 3px rgba(37,163,108,.18); }
.content { flex: 1; overflow: auto; padding: 24px 28px; }
.content.flush { padding: 0; overflow: hidden; }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 11px; font-weight: 700; font-size: 14px; border: 1px solid transparent; transition: all .12s; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--green-600); color: #fff; }
.btn-primary:hover { background: var(--green-700); }
.btn-ghost { background: var(--surface); color: var(--ink-2); border-color: var(--line); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--muted-2); }
.btn-danger { background: var(--danger-bg); color: var(--danger); }
.btn-danger:hover { background: #f7ddd9; }
.btn-lg { padding: 16px 22px; font-size: 16px; border-radius: 13px; }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); transition: background .12s, color .12s; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.card-pad { padding: 20px; }
.card-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 800; }

/* ---------- Inputs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.input, .select { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; font-size: 14.5px; background: var(--surface); color: var(--ink); transition: border .12s, box-shadow .12s; }
.input:focus, .select:focus { outline: none; border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(37,163,108,.15); }
.input::placeholder { color: var(--muted-2); }

/* ---------- KPIs ---------- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
.kpi-label { font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 7px; }
.kpi-label svg { width: 16px; height: 16px; }
.kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -.5px; margin-top: 8px; }
.kpi-delta { font-size: 12.5px; font-weight: 700; margin-top: 4px; }
.kpi-delta.up { color: var(--green-600); }
.kpi-delta.down { color: var(--danger); }

/* ---------- Tablas ---------- */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.table td { padding: 13px 16px; border-bottom: 1px solid var(--line-2); }
.table tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: var(--surface-2); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
.badge.ok { background: var(--green-50); color: var(--green-700); }
.badge.low { background: var(--warn-bg); color: var(--warn); }
.badge.out { background: var(--danger-bg); color: var(--danger); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,28,24,.42); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 50; padding: 24px; }
.modal { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 480px; overflow: hidden; animation: pop .16s ease-out; }
.modal-head { padding: 20px 24px; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 12px; }
.modal-head h2 { margin: 0; font-size: 18px; font-weight: 800; }
.modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
.modal-foot { padding: 16px 24px; border-top: 1px solid var(--line-2); display: flex; gap: 10px; justify-content: flex-end; background: var(--surface-2); }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Utilidades ---------- */
.row { display: flex; align-items: center; gap: 12px; }
.col { display: flex; flex-direction: column; }
.gap-sm { gap: 8px; } .gap-lg { gap: 20px; }
.spread { justify-content: space-between; }
.muted { color: var(--muted); }
.right { text-align: right; }
.grow { flex: 1; }
.section-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0 0 12px; }
.empty { display: grid; place-items: center; text-align: center; color: var(--muted); padding: 40px; }
.empty svg { width: 44px; height: 44px; color: var(--muted-2); margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto; }
.hr { height: 1px; background: var(--line-2); border: none; margin: 16px 0; }
.scroll { overflow: auto; }
.scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll::-webkit-scrollbar-thumb { background: #d3dad6; border-radius: 10px; border: 3px solid var(--surface); }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* ---------- Seg control / Chips ---------- */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg-btn { padding: 8px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.seg-btn.on { background: var(--green-600); color: #fff; }
.chip { padding: 8px 15px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; transition: all .12s; }
.chip:hover { border-color: var(--muted-2); }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ===================== POS / VENTA ===================== */
.pos-wrap { display: flex; height: 100%; }
.pos-left { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 20px 24px; gap: 16px; }
.pos-right { width: 420px; flex: 0 0 420px; border-left: 1px solid var(--line); background: var(--surface); display: flex; }
.pos-search { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 0 16px; transition: border .12s, box-shadow .12s; }
.pos-search:focus-within { border-color: var(--green-500); box-shadow: 0 0 0 4px rgba(37,163,108,.13); }
.pos-search svg { color: var(--green-600); flex: 0 0 auto; }
.pos-search.sm { border-radius: 11px; }
.pos-search.sm svg { color: var(--muted); }
.pos-search-input { flex: 1; border: none; outline: none; background: none; font-size: 16px; padding: 15px 0; color: var(--ink); }
.pos-search.sm .pos-search-input { padding: 10px 0; font-size: 14.5px; }
.pos-search-input::placeholder { color: var(--muted-2); }
.pos-search-clear { color: var(--muted); display: grid; place-items: center; }
.cat-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; flex: 0 0 auto; }
.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start; flex: 1; overflow-y: auto; padding-right: 4px; }
.prod-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 9px; transition: all .12s; }
.prod-card:hover { border-color: var(--green-500); box-shadow: var(--shadow); transform: translateY(-2px); }
.prod-card:active { transform: translateY(0); }
.prod-card.disabled { opacity: .5; }
.prod-card.disabled:hover { transform: none; border-color: var(--line); box-shadow: none; }
.prod-thumb { height: 64px; border-radius: 10px; background: var(--green-50); color: var(--green-700); display: grid; place-items: center; font-weight: 800; font-size: 20px; position: relative; letter-spacing: .5px; }
.prod-thumb[data-cat="bebidas"] { background: #E8F0FC; color: #2A6FDB; }
.prod-thumb[data-cat="golosinas"] { background: #FBEAF2; color: #C2487E; }
.prod-thumb[data-cat="snacks"] { background: #FBF1DC; color: #B5780E; }
.prod-thumb[data-cat="cigarrillos"] { background: #ECEEF1; color: #5B6470; }
.prod-thumb[data-cat="lacteos"] { background: #FFF7E6; color: #C28A0E; }
.prod-thumb[data-cat="panificados"] { background: #F6EEE2; color: #9A6B33; }
.prod-thumb[data-cat="limpieza"] { background: #E6F5F4; color: #1B8F86; }
.prod-flag { position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%; }
.prod-flag.low { background: var(--warn); }
.prod-flag.out { background: var(--danger); }
.prod-name { font-size: 13.5px; font-weight: 700; line-height: 1.25; min-height: 34px; }
.prod-foot { display: flex; align-items: baseline; justify-content: space-between; }
.prod-price { font-size: 15px; font-weight: 800; }
.prod-stock { font-size: 12px; color: var(--muted); }

/* Ticket */
.ticket { display: flex; flex-direction: column; width: 100%; }
.ticket-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line-2); }
.ticket-title { font-weight: 800; font-size: 16px; }
.ticket-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.ticket-items { flex: 1; overflow-y: auto; padding: 8px 12px; }
.ticket-line { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 10px; padding: 11px 8px; border-bottom: 1px solid var(--line-2); }
.ticket-line:last-child { border-bottom: none; }
.tl-info { min-width: 0; }
.tl-name { font-weight: 700; font-size: 14px; line-height: 1.2; }
.tl-unit { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.tl-sub { font-weight: 800; font-size: 14.5px; width: 84px; text-align: right; }
.tl-del { color: var(--muted-2); width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; }
.tl-del:hover { background: var(--danger-bg); color: var(--danger); }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.qty-btn { width: 28px; height: 30px; display: grid; place-items: center; color: var(--ink-2); background: var(--surface-2); }
.qty-btn:hover { background: var(--green-50); color: var(--green-700); }
.qty-val { width: 38px; height: 30px; border: none; text-align: center; font-size: 14px; font-weight: 700; outline: none; font-family: var(--mono); }
.ticket-foot { border-top: 1px solid var(--line); padding: 16px 20px; display: flex; flex-direction: column; gap: 9px; }
.tt-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); align-items: center; }
.tt-total { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 17px; margin: 4px 0 8px; }
.tt-total .mono { font-size: 26px; color: var(--green-700); }
.disc-input { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; background: var(--surface); }
.disc-input span { color: var(--muted); font-size: 13px; }
.disc-input input { border: none; outline: none; width: 84px; text-align: right; font-size: 14px; font-weight: 700; background: none; font-family: var(--mono); }
.disc-input:focus-within { border-color: var(--green-500); }

/* Cobro */
.pay-total { display: flex; justify-content: space-between; align-items: center; background: var(--green-50); border-radius: 12px; padding: 16px 18px; }
.pay-total span { font-weight: 600; color: var(--green-800); }
.pay-total strong { font-size: 28px; font-weight: 800; color: var(--green-700); }
.pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pay-method { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 16px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 700; font-size: 13px; color: var(--ink-2); transition: all .12s; }
.pay-method svg { color: var(--green-600); }
.pay-method:hover:not(:disabled) { border-color: var(--green-500); background: var(--green-50); }
.pay-method:disabled { opacity: .4; }
.pay-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.pay-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface-2); border-radius: 10px; }
.pay-row svg { color: var(--muted); }
.pay-row-label { flex: 1; font-weight: 600; font-size: 14px; }
.cash-quick { display: flex; gap: 7px; flex-wrap: wrap; }
.pay-summary { margin-top: 14px; }
.ps-row { display: flex; justify-content: space-between; font-weight: 800; font-size: 18px; }

/* Recibo */
.recibo { padding: 28px 24px 8px; text-align: center; }
.recibo-check { width: 60px; height: 60px; border-radius: 50%; background: var(--green-50); color: var(--green-600); display: grid; place-items: center; margin: 0 auto 14px; }
.recibo-title { font-weight: 800; font-size: 18px; }
.recibo-amount { font-size: 40px; font-weight: 800; color: var(--green-700); margin: 4px 0; }
.recibo-vuelto { color: var(--ink-2); margin-bottom: 8px; }
.recibo-ticket { text-align: left; border: 1px dashed var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; font-size: 13.5px; }
.rt-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
.rt-items { display: flex; flex-direction: column; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line-2); }
.rt-line { display: flex; justify-content: space-between; gap: 12px; }
.rt-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 16px; padding: 10px 0; border-bottom: 1px solid var(--line-2); margin-bottom: 10px; }
.rt-pays { display: flex; gap: 6px; flex-wrap: wrap; }
.rt-foot { text-align: center; margin-top: 12px; font-size: 12.5px; }

/* ===================== LOGIN ===================== */
.login { height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.login-aside { background: var(--green-700); color: #fff; padding: 56px; display: flex; flex-direction: column; gap: 32px; position: relative; overflow: hidden; }
.login-aside::after { content: ""; position: absolute; right: -120px; bottom: -120px; width: 360px; height: 360px; border-radius: 50%; background: rgba(255,255,255,.06); }
.login-aside::before { content: ""; position: absolute; right: 60px; top: -80px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,.05); }
.login-brand { display: flex; align-items: center; gap: 16px; }
.login-brand .brand-mark { background: #fff; color: var(--green-700); box-shadow: none; }
.login-illustration { display: flex; flex-direction: column; gap: 16px; margin-top: auto; margin-bottom: auto; position: relative; z-index: 1; }
.li-row { display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 500; }
.li-row svg { flex: 0 0 auto; opacity: .9; background: rgba(255,255,255,.12); padding: 9px; width: 42px; height: 42px; border-radius: 11px; }
.login-foot { color: rgba(255,255,255,.7) !important; text-transform: capitalize; position: relative; z-index: 1; }
.login-main { display: grid; place-items: center; padding: 40px; background: var(--bg); }
.login-card { width: 100%; max-width: 380px; }
.login-title { font-size: 26px; font-weight: 800; letter-spacing: -.4px; }
.login-sub { margin-top: 4px; font-size: 14.5px; }
.login-users { display: flex; flex-direction: column; gap: 8px; margin: 22px 0; }
.login-user { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 13px; background: var(--surface); text-align: left; transition: all .12s; }
.login-user:hover { border-color: var(--muted-2); }
.login-user.on { border-color: var(--green-600); background: var(--green-50); }
.lu-info { display: flex; flex-direction: column; }
.lu-info strong { font-size: 14.5px; }
.lu-info .muted { font-size: 12.5px; }
.pin-dots { display: flex; gap: 16px; justify-content: center; margin: 8px 0 18px; }
.pin-dots.err { animation: shake .3s; }
.pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--muted-2); transition: all .12s; }
.pin-dot.full { background: var(--green-600); border-color: var(--green-600); }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.login-error { text-align: center; color: var(--danger); font-weight: 700; font-size: 13.5px; margin-bottom: 12px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key { height: 58px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 22px; font-weight: 700; color: var(--ink); display: grid; place-items: center; transition: all .1s; }
.key:hover { background: var(--green-50); border-color: var(--green-200); }
.key:active { transform: scale(.96); }
.key-sub { color: var(--muted); font-size: 17px; }
.login-hint { text-align: center; margin-top: 18px; font-size: 12px; }

/* ===================== STOCK ===================== */
.stock-adjust { display: inline-flex; align-items: center; gap: 8px; }
.stock-adjust button { width: 26px; height: 26px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }
.stock-adjust button:hover { background: var(--green-50); color: var(--green-700); border-color: var(--green-200); }
.stock-adjust span { min-width: 42px; text-align: center; font-weight: 700; font-family: var(--mono); }

/* ===================== REPORTES ===================== */
.report-cols { display: flex; gap: 20px; align-items: flex-start; }
.bar-track { height: 8px; background: var(--line-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--green-600); border-radius: 999px; }

/* ===================== CAJA ===================== */
.caja-cols { display: flex; gap: 20px; align-items: flex-start; }
.caja-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
.caja-meta > div { display: flex; flex-direction: column; gap: 3px; }
.caja-meta .muted { font-size: 12.5px; }
.caja-meta strong { font-size: 15px; }
.arqueo-head { display: grid; grid-template-columns: 1fr 110px 130px; gap: 12px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; }
.arqueo-row { display: grid; grid-template-columns: 1fr 110px 130px; gap: 12px; align-items: center; }
.ar-label { display: flex; flex-direction: column; }
.ar-label strong { font-size: 14px; }
.ar-label .muted { font-size: 11.5px; }
.ar-exp { text-align: right; color: var(--ink-2); font-weight: 600; font-family: var(--mono); }
.arqueo-row .disc-input { justify-content: flex-end; }
.arqueo-row .disc-input input { width: 90px; }

/* ===================== ADMIN ===================== */
.repo-row { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--line-2); }
.repo-row:last-child { border-bottom: none; }
.repo-row > div:first-child { flex: 1; }

/* ===================== TOASTS ===================== */
.toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 80; align-items: center; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 9px; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-lg); animation: toastIn .2s ease-out; }
.toast.err { background: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* BarChart */
.bar-chart { display: flex; align-items: flex-end; gap: 4px; width: 100%; }
.bar-chart-col { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; min-width: 0; }
.bar-chart-bar { width: 100%; border-radius: 6px 6px 0 0; background: var(--green-500); min-height: 3px; transition: height .3s; }
.bar-chart-bar:hover { background: var(--green-700); }
.bar-chart-label { font-size: 10px; color: var(--muted); font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

@media print {
  .sidebar, .topbar, .modal-foot { display: none !important; }
}

/* ── Escáner cámara ── */
.cam-overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
.cam-wrap { position:relative; width:min(90vw,480px); border-radius:16px; overflow:hidden; background:#000; aspect-ratio:4/3; }
.cam-wrap video { width:100%; height:100%; object-fit:cover; display:block; }
.cam-frame { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.cam-frame::before { content:""; display:block; width:65%; aspect-ratio:3/1; border:3px solid rgba(37,163,108,.9); border-radius:8px; box-shadow:0 0 0 9999px rgba(0,0,0,.4); animation:camPulse 1.5s ease-in-out infinite; }
@keyframes camPulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.cam-hint { color:rgba(255,255,255,.8); font-size:13px; text-align:center; max-width:280px; }
.cam-btn-close { padding:11px 28px; border-radius:10px; background:rgba(255,255,255,.15); color:#fff; font-size:14px; font-weight:700; border:1px solid rgba(255,255,255,.25); cursor:pointer; font-family:inherit; }
.cam-btn-close:hover { background:rgba(255,255,255,.25); }
.btn-cam { display:flex; align-items:center; gap:6px; padding:10px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--green-600); font-size:13px; font-weight:700; cursor:pointer; transition:all .12s; font-family:inherit; white-space:nowrap; }
.btn-cam:hover { border-color:var(--green-500); background:var(--green-50); }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ============================================================
     CARGA DESDE SUPABASE + STORE GLOBAL
     ============================================================ -->
<script type="text/babel">
// ---- CONFIG ----
const SUPABASE_URL = 'https://vhoswhyixqtomgqudigj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZob3N3aHlpeHF0b21ncXVkaWdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTI4ODIsImV4cCI6MjA5NTM4ODg4Mn0.gjUaVJ1RvF3KrjfXVyh8wYIso4QW6RtIfFRbkd0PyA8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Lee el negocio del query string: ?n=mercadito-san-juan
const NEGOCIO_SLUG = new URLSearchParams(window.location.search).get('n') || '';

// Métodos de pago fijos
window.PAYMENT_METHODS = [
  { id:'efectivo',      nombre:'Efectivo',                 atajo:'F1' },
  { id:'tarjeta',       nombre:'Tarjeta',                  atajo:'F2' },
  { id:'qr',            nombre:'QR / Billetera',           atajo:'F3' },
  { id:'transferencia', nombre:'Transferencia',            atajo:'F4' },
  { id:'fiado',         nombre:'Cuenta corriente (fiado)', atajo:'F5' },
];

// Estado global - se llena async desde Supabase
window.NEGOCIO_ID = null;
window.POS_LOADED = false;

// ---- STORE ----
(function() {
  const uid = p => p + Math.random().toString(36).slice(2,9);
  function nowISO() { return new Date().toISOString(); }

  // Cache local por negocio para operaciones offline
  const CACHE_KEY = 'pos_cache_' + NEGOCIO_SLUG;

  function emptyState() {
    return {
      booted: false,
      loading: true,
      error: null,
      user: null,
      negocioId: null,
      products: [],
      categories: [],
      users: [],
      settings: { negocio:'', cuit:'', direccion:'', moneda:'ARS', simbolo:'$', ivaIncluido:true, ticketFooter:'¡Gracias por su compra!' },
      paymentMethods: window.PAYMENT_METHODS,
      cart: [],
      descuento: 0,
      sales: [],
      cashSessions: [],
      currentSessionId: null,
      lastSale: null,
    };
  }

  let state = emptyState();
  const subs = new Set();
  function emit() { subs.forEach(fn => fn()); }
  function setState(patch) {
    const next = typeof patch === 'function' ? patch(state) : patch;
    state = Object.assign({}, state, next);
    emit();
  }
  function getState() { return state; }
  function subscribe(fn) { subs.add(fn); return () => subs.delete(fn); }

  // ---- CARGA INICIAL DESDE SUPABASE ----
  async function cargarNegocio() {
    if (!NEGOCIO_SLUG) {
      setState({ booted:true, loading:false, error:'No se especificó ningún negocio en la URL (parámetro ?n=)' });
      return;
    }

    try {
    // 1. Negocio
    const { data: neg, error: negErr } = await sb.from('negocios_pos').select('*').eq('slug', NEGOCIO_SLUG).eq('activo', true).single();
    if (negErr || !neg) {
      setState({ booted:true, loading:false, error:'Negocio no encontrado o inactivo: ' + NEGOCIO_SLUG + (negErr ? ' — ' + negErr.message : '') });
      return;
    }
    window.NEGOCIO_ID = neg.id;

    // 2. Cargar en paralelo — cada query falla gracefully
    const safeQuery = async (q) => { try { const r = await q; return r.data || []; } catch(e) { return []; } };
    const [usuarios, categorias, productos, ventas, sesiones] = await Promise.all([
      safeQuery(sb.from('pos_cajeros').select('*').eq('negocio_id', neg.id).eq('activo', true)),
      safeQuery(sb.from('pos_categorias').select('*').eq('negocio_id', neg.id).order('orden')),
      safeQuery(sb.from('pos_productos').select('*').eq('negocio_id', neg.id).eq('activo', true)),
      safeQuery(sb.from('pos_ventas').select('*').eq('negocio_id', neg.id).order('created_at', { ascending:false }).limit(200)),
      safeQuery(sb.from('pos_sesiones_caja').select('*').eq('negocio_id', neg.id).order('opened_at', { ascending:false }).limit(30)),
    ]);

    // Normalizar productos al formato interno
    const prods = (productos||[]).map(p => ({
      id: p.id,
      nombre: p.nombre,
      cat: p.categoria_id || 'sin-cat',
      barcode: p.barcode || '',
      precio: Number(p.precio),
      costo: Number(p.costo),
      stock: Number(p.stock),
      minStock: Number(p.min_stock),
      unidad: p.unidad || 'u',
    }));

    // Normalizar categorías
    const cats = (categorias||[]).map(c => ({ id: c.id, nombre: c.nombre }));
    if (!cats.length) cats.push({ id:'sin-cat', nombre:'General' });

    // Normalizar usuarios
    const usrs = (usuarios||[]).map(u => ({
      id: u.id, nombre: u.nombre, rol: u.rol, pin: u.pin, inicial: u.inicial,
    }));

    // Normalizar ventas
    const venN = (ventas||[]).map(v => ({
      id: v.id, numero: v.numero, ts: v.created_at,
      items: v.items || [], subtotal: Number(v.subtotal),
      descuento: Number(v.descuento), total: Number(v.total),
      payments: v.payments || [], cajero: v.cajero, sessionId: v.sesion_id,
    }));

    // Normalizar sesiones
    const sesN = (sesiones||[]).map(s => ({
      id: s.id, cajero: s.cajero_nombre, openedAt: s.opened_at,
      openingAmount: Number(s.opening_amount), closedAt: s.closed_at,
      status: s.status, counted: s.counted, expectedByMethod: s.expected_by_method,
      expectedEfectivo: Number(s.expected_efectivo||0),
      difference: Number(s.difference||0),
      totalVendido: Number(s.total_vendido||0), ticketCount: s.ticket_count||0,
    }));

    // Sesión abierta
    const sesionAbierta = sesN.find(s => s.status === 'abierta');

    // Recuperar carrito de cache local
    let cartCache = [];
    try { const c = JSON.parse(localStorage.getItem(CACHE_KEY+'_cart')||'[]'); cartCache = c; } catch(e){}

    setState({
      booted: true,
      loading: false,
      error: null,
      negocioId: neg.id,
      products: prods,
      categories: cats,
      users: usrs,
      settings: {
        negocio: neg.nombre,
        cuit: neg.cuit || '',
        direccion: neg.direccion || '',
        moneda: neg.moneda || 'ARS',
        simbolo: neg.simbolo || '$',
        ivaIncluido: neg.iva_incluido !== false,
        ticketFooter: neg.ticket_footer || '¡Gracias por su compra!',
      },
      paymentMethods: window.PAYMENT_METHODS,
      cart: cartCache,
      descuento: 0,
      sales: venN,
      cashSessions: sesN,
      currentSessionId: sesionAbierta ? sesionAbierta.id : null,
    });
    } catch(e) {
      setState({ booted:true, loading:false, error:'Error al cargar el negocio: ' + (e.message||String(e)) });
    }
  }

  // ---- ACCIONES ----
  function findProduct(id) { return state.products.find(p => p.id===id); }
  function cartLines() {
    return state.cart.map(c => {
      const p = findProduct(c.productId);
      return { ...c, producto:p, subtotal:(p?p.precio:0)*c.qty };
    });
  }
  function cartSubtotal() { return cartLines().reduce((s,l) => s+l.subtotal, 0); }
  function cartTotal() { return Math.max(0, cartSubtotal() - (state.descuento||0)); }
  function cartCount() { return state.cart.reduce((s,c) => s+c.qty, 0); }
  function currentSession() { return state.cashSessions.find(s => s.id===state.currentSessionId)||null; }

  function saveCartCache(cart) {
    try { localStorage.setItem(CACHE_KEY+'_cart', JSON.stringify(cart)); } catch(e){}
  }

  const POS = {
    login(userId, pin) {
      const u = state.users.find(x => x.id===userId);
      if (!u) return {ok:false, error:'Usuario no encontrado'};
      if (String(pin)!==String(u.pin)) return {ok:false, error:'PIN incorrecto'};
      setState({user:u}); return {ok:true};
    },
    logout() { setState({user:null}); },

    addToCart(productId, qty=1) {
      const p = findProduct(productId);
      if (!p) return {ok:false};
      setState(st => {
        const existing = st.cart.find(c => c.productId===productId);
        const cart = existing
          ? st.cart.map(c => c.productId===productId ? {...c, qty:c.qty+qty} : c)
          : [...st.cart, {productId, qty}];
        saveCartCache(cart);
        return {cart};
      });
      return {ok:true, producto:p};
    },
    addByBarcode(code) {
      const p = state.products.find(x => x.barcode===String(code).trim());
      if (!p) return {ok:false, error:'Código no encontrado'};
      POS.addToCart(p.id); return {ok:true, producto:p};
    },
    setQty(productId, qty) {
      qty = Math.max(0, Math.round(qty));
      setState(st => {
        const cart = qty===0
          ? st.cart.filter(c => c.productId!==productId)
          : st.cart.map(c => c.productId===productId ? {...c,qty} : c);
        saveCartCache(cart);
        return {cart};
      });
    },
    removeFromCart(productId) {
      setState(st => { const cart=st.cart.filter(c=>c.productId!==productId); saveCartCache(cart); return {cart}; });
    },
    clearCart() { saveCartCache([]); setState({cart:[],descuento:0}); },
    setDescuento(amount) { setState({descuento:Math.max(0,Math.round(amount||0))}); },

    async checkout(payments) {
      const lines = cartLines();
      if (!lines.length) return {ok:false, error:'Carrito vacío'};
      const subtotal = cartSubtotal();
      const descuento = state.descuento||0;
      const total = cartTotal();
      const sesion = currentSession();

      // Guardar venta en Supabase
      const ventaData = {
        negocio_id: state.negocioId,
        sesion_id: sesion ? sesion.id : null,
        numero: state.sales.length + 1,
        cajero: state.user ? state.user.nombre : '—',
        items: lines.map(l => ({ productId:l.productId, nombre:l.producto.nombre, precio:l.producto.precio, costo:l.producto.costo, qty:l.qty })),
        subtotal, descuento, total,
        payments,
      };
      const { data: ventaG, error: ventaErr } = await sb.from('pos_ventas').insert(ventaData).select().single();
      if (ventaErr) return {ok:false, error:ventaErr.message};

      // Actualizar stock en Supabase
      await Promise.all(lines.map(l =>
        sb.from('pos_productos').update({ stock: Math.max(0, ((findProduct(l.productId)||{stock:0}).stock||0) - l.qty) }).eq('id', l.productId)
      ));

      const saleNorm = { id:ventaG.id, numero:ventaG.numero, ts:ventaG.created_at, items:ventaG.items, subtotal, descuento, total, payments, cajero:ventaG.cajero, sessionId:ventaG.sesion_id };

      setState(st => {
        const products = st.products.map(p => {
          const ln = lines.find(l=>l.productId===p.id);
          return ln ? {...p, stock:Math.max(0,+(p.stock-ln.qty).toFixed(3))} : p;
        });
        return { products, sales:[saleNorm,...st.sales], cart:[], descuento:0, lastSale:saleNorm };
      });
      saveCartCache([]);
      return {ok:true, sale:saleNorm};
    },

    async upsertProduct(prod) {
      const catId = prod.cat === 'sin-cat' ? null : prod.cat;
      const datos = {
        negocio_id: state.negocioId,
        categoria_id: catId,
        nombre: prod.nombre,
        barcode: prod.barcode || '',
        precio: prod.precio,
        costo: prod.costo,
        stock: prod.stock,
        min_stock: prod.minStock,
        unidad: prod.unidad,
        activo: true,
      };
      if (prod.nuevo || !prod.id) {
        const { data, error } = await sb.from('pos_productos').insert(datos).select().single();
        if (error) return;
        const newProd = { id:data.id, nombre:data.nombre, cat:data.categoria_id||'sin-cat', barcode:data.barcode, precio:Number(data.precio), costo:Number(data.costo), stock:Number(data.stock), minStock:Number(data.min_stock), unidad:data.unidad };
        setState(st => ({ products:[...st.products, newProd] }));
      } else {
        await sb.from('pos_productos').update(datos).eq('id', prod.id);
        setState(st => ({ products:st.products.map(p => p.id===prod.id ? {...p,...{nombre:prod.nombre,cat:prod.cat,barcode:prod.barcode,precio:prod.precio,costo:prod.costo,minStock:prod.minStock,unidad:prod.unidad}} : p) }));
      }
    },

    async adjustStock(productId, delta) {
      const p = findProduct(productId);
      if (!p) return;
      const newStock = Math.max(0, p.stock + delta);
      await sb.from('pos_productos').update({ stock:newStock }).eq('id', productId);
      setState(st => ({ products:st.products.map(p => p.id===productId ? {...p,stock:newStock} : p) }));
    },

    async deleteProduct(productId) {
      await sb.from('pos_productos').update({ activo:false }).eq('id', productId);
      setState(st => ({ products:st.products.filter(p => p.id!==productId) }));
    },

    async openSession(openingAmount) {
      const s = {
        negocio_id: state.negocioId,
        cajero_nombre: state.user ? state.user.nombre : '—',
        usuario_id: state.user ? state.user.id : null,
        opening_amount: Number(openingAmount)||0,
        status: 'abierta',
      };
      const { data, error } = await sb.from('pos_sesiones_caja').insert(s).select().single();
      if (error) return {ok:false};
      const sesNorm = { id:data.id, cajero:data.cajero_nombre, openedAt:data.opened_at, openingAmount:Number(data.opening_amount), closedAt:null, status:'abierta', counted:null, expectedByMethod:null, expectedEfectivo:0, difference:0, totalVendido:0, ticketCount:0 };
      setState(st => ({ cashSessions:[sesNorm,...st.cashSessions], currentSessionId:data.id }));
      return {ok:true, session:sesNorm};
    },

    async closeSession(countedByMethod) {
      const session = currentSession();
      if (!session) return {ok:false};
      const venSes = state.sales.filter(v => v.sessionId===session.id);
      const expectedByMethod = {};
      venSes.forEach(v => v.payments.forEach(p => { expectedByMethod[p.method]=(expectedByMethod[p.method]||0)+p.amount; }));
      const expectedEfectivo = (expectedByMethod.efectivo||0) + session.openingAmount;
      const difference = (countedByMethod.efectivo||0) - expectedEfectivo;
      const totalVendido = venSes.reduce((a,v)=>a+v.total,0);

      const update = {
        status:'cerrada', closed_at:nowISO(),
        counted:countedByMethod, expected_by_method:expectedByMethod,
        expected_efectivo:expectedEfectivo, difference,
        total_vendido:totalVendido, ticket_count:venSes.length,
      };
      await sb.from('pos_sesiones_caja').update(update).eq('id', session.id);

      const closed = { ...session, closedAt:nowISO(), status:'cerrada', counted:countedByMethod, expectedByMethod, expectedEfectivo, difference, totalVendido, ticketCount:venSes.length };
      setState(st => ({ cashSessions:st.cashSessions.map(s=>s.id===closed.id?closed:s), currentSessionId:null }));
      return {ok:true, session:closed};
    },

    async updateSettings(patch) {
      await sb.from('negocios_pos').update({
        nombre:patch.negocio, cuit:patch.cuit, direccion:patch.direccion, ticket_footer:patch.ticketFooter,
      }).eq('id', state.negocioId);
      setState(st => ({ settings:{...st.settings,...patch} }));
    },

    resetAll() { window.location.reload(); },
  };

  POS.findProduct = findProduct;
  POS.cartLines = cartLines;
  POS.cartSubtotal = cartSubtotal;
  POS.cartTotal = cartTotal;
  POS.cartCount = cartCount;
  POS.currentSession = currentSession;

  window.POSStore = { getState, setState, subscribe };
  window.POS = POS;

  window.useStore = function() {
    const R = window.React;
    const [,force] = R.useReducer(x=>x+1, 0);
    R.useEffect(() => subscribe(force), []);
    return getState();
  };

  window.fmt = function(n) { return '$ ' + Math.round(Number(n)||0).toLocaleString('es-AR'); };
  window.fmtNum = function(n) { return (Number(n)||0).toLocaleString('es-AR'); };
  window.fmtDate = function(d, opts) { return new Date(d).toLocaleDateString('es-AR', opts||{day:'2-digit',month:'short',year:'numeric'}); };

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback, useReducer } = React;

// Hook reloj
function useClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(t); }, []);
  return now;
}
window.useClock = useClock;

// Hook toasts
function useToasts() {
  const [toasts, setToasts] = useState([]);
  function push(msg, type="ok") {
    const id = Math.random().toString(36).slice(2);
    setToasts(ts => [...ts, {id, msg, type}]);
    setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), 2800);
  }
  const node = (
    <div className="toasts">
      {toasts.map(t => (
        <div key={t.id} className={"toast " + t.type}>
          {t.type === "ok" ? <Icon name="check" size={18}/> : <Icon name="alert" size={18}/>}
          {t.msg}
        </div>
      ))}
    </div>
  );
  return [push, node];
}
window.useToasts = useToasts;

// Modal
function Modal({ open, onClose, children, max }) {
  if (!open) return null;
  return (
    <div className="overlay" onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={max ? {maxWidth:max} : {}}>
        {children}
      </div>
    </div>
  );
}
window.Modal = Modal;

// QtyStepper
function QtyStepper({ value, onChange, min=1 }) {
  return (
    <div className="qty">
      <button className="qty-btn" onClick={() => onChange(Math.max(min, value-1))}><Icon name="minus" size={14}/></button>
      <input className="qty-val" value={value} readOnly style={{fontFamily:"var(--mono)"}}/>
      <button className="qty-btn" onClick={() => onChange(value+1)}><Icon name="plus" size={14}/></button>
    </div>
  );
}
window.QtyStepper = QtyStepper;

// BarChart
function BarChart({ data, height=200 }) {
  const max = Math.max(...data.map(d => d.value), 1);
  return (
    <div className="bar-chart" style={{height}}>
      {data.map((d,i) => (
        <div key={i} className="bar-chart-col" style={{height:"100%",justifyContent:"flex-end"}}>
          <div style={{flex:1,display:"flex",alignItems:"flex-end"}}>
            <div className="bar-chart-bar" title={fmt(d.value)} style={{height: Math.max(3,(d.value/max)*100)+"%", width:"100%"}}></div>
          </div>
          <div className="bar-chart-label">{d.label}</div>
        </div>
      ))}
    </div>
  );
}
window.BarChart = BarChart;

// StockBadge
function StockBadge({ p }) {
  if (p.stock <= 0) return <span className="badge out">Sin stock</span>;
  if (p.stock <= p.minStock) return <span className="badge low">Stock bajo</span>;
  return <span className="badge ok">OK</span>;
}
window.StockBadge = StockBadge;
</script>

        <div className="login-card">
          <div className="login-title">Iniciar sesión</div>
          <div className="login-sub muted">Elegí tu usuario e ingresá tu PIN</div>
          <div className="login-users">
            {s.users.map(u => (
              <button key={u.id} className={"login-user"+(u.id===userId?" on":"")} onClick={()=>{setUserId(u.id);setPin("");setError("");}}>
                <span className="avatar">{u.inicial}</span>
                <span className="lu-info"><strong>{u.nombre}</strong><span className="muted">{u.rol}</span></span>
              </button>
            ))}
          </div>
          <div className={"pin-dots"+(error?" err":"")}>
            {[0,1,2,3].map(i => <span key={i} className={"pin-dot"+(pin.length>i?" full":"")}></span>)}
          </div>
          {error && <div className="login-error">{error}</div>}
          <div className="keypad">
            {[1,2,3,4,5,6,7,8,9].map(n => (
              <button key={n} className="key" onClick={()=>press(String(n))}>{n}</button>
            ))}

            <button className="key" onClick={()=>press("0")}>0</button>

}

<script type="text/babel">
const { useState: useStateV, useEffect: useEffectV, useRef: useRefV, useMemo: useMemoV } = React;

function VentaScreen({ pushToast }) {
  const s = useStore();
  const [query, setQuery] = useStateV("");
  const [cat, setCat] = useStateV("todos");
  const [checkout, setCheckout] = useStateV(false);
  const [recibo, setRecibo] = useStateV(null);
  const [camAbierta, setCamAbierta] = useStateV(false);
  const searchRef = useRefV(null);

  function onCodigoEscaneado(code) {
    setCamAbierta(false);
    if (!code) return;
    const byCode = s.products.find(p => p.barcode === code);
    if (byCode) {
      if (byCode.stock <= 0) { pushToast("Sin stock: " + byCode.nombre, "err"); return; }
      POS.addToCart(byCode.id);
      pushToast("📷 " + byCode.nombre + " agregado");
    } else {
      // Poner el código en el buscador para búsqueda manual
      setQuery(code);
      pushToast("Código " + code + " no encontrado — buscando…", "err");
    }
    setTimeout(() => searchRef.current && searchRef.current.focus(), 100);
  }

  const lines = POS.cartLines();
  const subtotal = POS.cartSubtotal();
  const total = POS.cartTotal();

  useEffectV(() => { if(!checkout && !recibo) searchRef.current && searchRef.current.focus(); }, [checkout, recibo, s.cart.length]);

  const filtered = useMemoV(() => {
    const q = query.trim().toLowerCase();
    return s.products.filter(p => {
      if (cat!=="todos" && p.cat!==cat) return false;
      if (!q) return true;
      return p.nombre.toLowerCase().includes(q) || p.barcode.includes(q);
    });
  }, [s.products, query, cat]);

  function onSearchKey(e) {
    if (e.key!=="Enter") return;
    const code = query.trim();
    if (!code) return;
    const byCode = s.products.find(p => p.barcode===code);
    if (byCode) { POS.addToCart(byCode.id); pushToast(byCode.nombre+" agregado"); setQuery(""); return; }
    if (filtered.length===1) { POS.addToCart(filtered[0].id); pushToast(filtered[0].nombre+" agregado"); setQuery(""); return; }
    if (filtered.length===0) pushToast("Sin resultados para «"+code+"»","err");
  }

  function addProduct(p) {
    if (p.stock<=0) { pushToast("Sin stock: "+p.nombre,"err"); return; }
    POS.addToCart(p.id);
  }

  async function confirmSale(payments, vuelto) {
    const res = await POS.checkout(payments);
    if (res.ok) { setCheckout(false); setRecibo({sale:res.sale, vuelto}); }
  }

  return (
    <div className="pos-wrap">
      <div className="pos-left">
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <div className="pos-search" style={{flex:1}}>
            <Icon name="scan" size={22}/>
            <input ref={searchRef} className="pos-search-input" value={query}
              onChange={e=>setQuery(e.target.value)} onKeyDown={onSearchKey}
              placeholder="Escaneá un código de barras o buscá por nombre…"/>
            {query && <button className="pos-search-clear" onClick={()=>setQuery("")}><Icon name="x" size={18}/></button>}
          </div>
          <button className="btn-cam" onClick={()=>setCamAbierta(true)} title="Escanear con cámara">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
            Cámara
          </button>
        </div>
        <div className="cat-chips scroll">
          <button className={"chip"+(cat==="todos"?" on":"")} onClick={()=>setCat("todos")}>Todos</button>
          {s.categories.map(c => (
            <button key={c.id} className={"chip"+(cat===c.id?" on":"")} onClick={()=>setCat(c.id)}>{c.nombre}</button>
          ))}
        </div>
        <div className="prod-grid scroll">
          {filtered.map(p => (
            <button key={p.id} className={"prod-card"+(p.stock<=0?" disabled":"")} onClick={()=>addProduct(p)}>
              <div className="prod-thumb" data-cat={p.cat}>
                <span>{p.nombre.split(" ").slice(0,2).map(w=>w[0]).join("")}</span>
                {p.stock<=p.minStock && <span className={"prod-flag "+(p.stock<=0?"out":"low")}></span>}
              </div>
              <div className="prod-name">{p.nombre}</div>
              <div className="prod-foot">
                <span className="prod-price mono">{fmt(p.precio)}</span>
                <span className="prod-stock mono">{p.stock} {p.unidad}</span>
              </div>
            </button>
          ))}
          {filtered.length===0 && (
            <div className="empty" style={{gridColumn:"1/-1"}}><Icon name="search"/><div>No hay productos que coincidan</div></div>
          )}
        </div>
      </div>

      <div className="pos-right">
        <div className="ticket">
          <div className="ticket-head">
            <div>
              <div className="ticket-title">Venta actual</div>
              <div className="ticket-meta">{lines.length} ítems · {POS.cartCount()} unidades</div>
            </div>
            {lines.length>0 && (
              <button className="btn btn-ghost btn-sm" onClick={()=>POS.clearCart()}><Icon name="trash" size={16}/>Vaciar</button>
            )}
          </div>
          <div className="ticket-items scroll">
            {lines.length===0 && (
              <div className="empty"><Icon name="cart"/><div>Escaneá o tocá un producto<br/>para empezar la venta</div></div>
            )}
            {lines.map(l => (
              <div className="ticket-line" key={l.productId}>
                <div className="tl-info">
                  <div className="tl-name">{l.producto.nombre}</div>
                  <div className="tl-unit mono">{fmt(l.producto.precio)} c/u</div>
                </div>
                <QtyStepper value={l.qty} min={0} onChange={v=>POS.setQty(l.productId,v)}/>
                <div className="tl-sub mono">{fmt(l.subtotal)}</div>
                <button className="tl-del" onClick={()=>POS.removeFromCart(l.productId)}><Icon name="x" size={16}/></button>
              </div>
            ))}
          </div>
          <div className="ticket-foot">
            <div className="tt-row"><span>Subtotal</span><span className="mono">{fmt(subtotal)}</span></div>
            <div className="tt-row">
              <span>Descuento</span>
              <div className="disc-input">
                <span className="mono">$</span>
                <input className="mono" value={s.descuento||""} placeholder="0"
                  onChange={e=>POS.setDescuento(parseInt(e.target.value.replace(/\D/g,""),10)||0)}/>
              </div>
            </div>
            <div className="tt-total"><span>Total</span><span className="mono">{fmt(total)}</span></div>
            <button className="btn btn-primary btn-lg btn-block" disabled={lines.length===0} onClick={()=>setCheckout(true)}>
              <Icon name="cash" size={20}/>Cobrar {fmt(total)}
            </button>
          </div>
        </div>
      </div>

      <CheckoutModal open={checkout} total={total} methods={s.paymentMethods}
        onClose={()=>setCheckout(false)} onConfirm={confirmSale}/>
      <ReciboModal data={recibo} settings={s.settings} onClose={()=>setRecibo(null)}/>
      {camAbierta && <CamaraScanner onResult={onCodigoEscaneado} onClose={()=>setCamAbierta(false)}/>}
    </div>
  );
}

// ── Escáner de cámara con ZXing ──────────────────────────
function CamaraScanner({ onResult, onClose }) {
  const videoRef = useRefV(null);
  const [error, setError] = useStateV(null);
  const [cargando, setCargando] = useStateV(true);
  const readerRef = useRefV(null);

  useEffectV(() => {
    let activo = true;

    async function iniciar() {
      try {
        if (typeof ZXing === "undefined") {
          setError("La librería de escaneo no está disponible. Verificá tu conexión.");
          setCargando(false);
          return;
        }

        const hints = new Map();
        const formats = [
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.EAN_8,
          ZXing.BarcodeFormat.CODE_128,
          ZXing.BarcodeFormat.CODE_39,
          ZXing.BarcodeFormat.UPC_A,
          ZXing.BarcodeFormat.UPC_E,
          ZXing.BarcodeFormat.QR_CODE,
        ];
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

        const reader = new ZXing.BrowserMultiFormatReader(hints);
        readerRef.current = reader;

        const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();
        if (!devices || !devices.length) {
          setError("No se encontró cámara en este dispositivo.");
          setCargando(false);
          return;
        }

        // Preferir cámara trasera
        const trasera = devices.find(d =>
          d.label.toLowerCase().includes("back") ||
          d.label.toLowerCase().includes("rear") ||
          d.label.toLowerCase().includes("trasera") ||
          d.label.toLowerCase().includes("environment")
        ) || devices[devices.length - 1];

        setCargando(false);

        await reader.decodeFromVideoDevice(trasera.deviceId, videoRef.current, (result, err) => {
          if (!activo) return;
          if (result) {
            const code = result.getText();
            if (code) {
              // Vibrar si el dispositivo lo soporta
              if (navigator.vibrate) navigator.vibrate(80);
              onResult(code);
            }
          }
        });
      } catch(e) {
        if (!activo) return;
        if (e.name === "NotAllowedError") {
          setError("Permiso de cámara denegado. Habilitalo desde la configuración del navegador.");
        } else if (e.name === "NotFoundError") {
          setError("No se encontró cámara disponible.");
        } else {
          setError("Error al iniciar la cámara: " + e.message);
        }
        setCargando(false);
      }
    }

    iniciar();

    return () => {
      activo = false;
      if (readerRef.current) {
        try { readerRef.current.reset(); } catch(e) {}
      }
    };
  }, []);

  return (
    <div className="cam-overlay" onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div className="cam-wrap">
        <video ref={videoRef} autoPlay playsInline muted style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
        {!error && <div className="cam-frame"></div>}
        {cargando && !error && (
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.5)"}}>
            <div style={{width:36,height:36,border:"4px solid rgba(255,255,255,.3)",borderTopColor:"#fff",borderRadius:"50%",animation:"spin .7s linear infinite"}}></div>
          </div>
        )}
        {error && (
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,.8)",padding:24,gap:12}}>
            <div style={{fontSize:32}}>📷</div>
            <div style={{color:"#fff",fontSize:13,textAlign:"center",lineHeight:1.5}}>{error}</div>
          </div>
        )}
      </div>
      <div className="cam-hint">
        Apuntá la cámara al código de barras del producto
      </div>
      <button className="cam-btn-close" onClick={onClose}>✕ Cerrar</button>
    </div>
  );
}

function CheckoutModal({ open, total, methods, onClose, onConfirm }) {
  const [payments, setPayments] = useStateV([]);
  useEffectV(()=>{ if(open) setPayments([]); }, [open]);

  const paid = payments.reduce((s,p)=>s+p.amount, 0);
  const restante = Math.max(0, total-paid);
  const efectivoPagado = payments.filter(p=>p.method==="efectivo").reduce((s,p)=>s+p.amount, 0);
  const vuelto = Math.max(0, paid-total);
  const cubierto = paid>=total;

  function pick(m) { setPayments(ps=>[...ps,{method:m.id,label:m.nombre,amount:restante||total}]); }
  function setAmt(i,v) { setPayments(ps=>ps.map((p,idx)=>idx===i?{...p,amount:Math.max(0,v)}:p)); }
  function del(i) { setPayments(ps=>ps.filter((_,idx)=>idx!==i)); }

  const cashQuick = useMemoV(()=>{
    const opts=new Set();
    [1000,2000,5000,10000].forEach(b=>opts.add(Math.ceil(total/b)*b));
    opts.add(total);
    return Array.from(opts).filter(x=>x>0).sort((a,b)=>a-b).slice(0,4);
  },[total]);

  const mIcon = {efectivo:"cash",tarjeta:"card",qr:"qr",transferencia:"bank",fiado:"user"};

  return (
    <Modal open={open} onClose={onClose} max={560}>
      <div className="modal-head"><Icon name="cash" size={22} style={{color:"var(--green-600)"}}/><h2>Cobrar venta</h2></div>
      <div className="modal-body">
        <div className="pay-total"><span>Total a cobrar</span><strong className="mono">{fmt(total)}</strong></div>
        <div className="section-title" style={{marginTop:18}}>Método de pago</div>
        <div className="pay-grid">
          {methods.map(m => (
            <button key={m.id} className="pay-method" onClick={()=>pick(m)} disabled={cubierto&&restante===0}>
              <Icon name={mIcon[m.id]||"cash"} size={22}/><span>{m.nombre}</span>
            </button>
          ))}
        </div>
        {payments.length>0 && (
          <div className="pay-list">
            {payments.map((p,i)=>(
              <div className="pay-row" key={i}>
                <Icon name={mIcon[p.method]||"cash"} size={18}/>
                <span className="pay-row-label">{p.label}</span>
                <div className="disc-input"><span className="mono">$</span>
                  <input className="mono" value={p.amount} onChange={e=>setAmt(i,parseInt(e.target.value.replace(/\D/g,""),10)||0)}/>
                </div>
                <button className="tl-del" onClick={()=>del(i)}><Icon name="x" size={15}/></button>
              </div>
            ))}
            {efectivoPagado>0 && (
              <div className="cash-quick">
                {cashQuick.map(q=>(
                  <button key={q} className="chip" onClick={()=>{
                    const idx=payments.findIndex(p=>p.method==="efectivo");
                    if(idx>=0) setAmt(idx,q);
                  }}>{fmt(q)}</button>
                ))}
              </div>
            )}
          </div>
        )}
        <div className="pay-summary">
          {restante>0
            ? <div className="ps-row"><span>Restante</span><span className="mono" style={{color:"var(--danger)"}}>{fmt(restante)}</span></div>
            : <div className="ps-row"><span>Vuelto</span><span className="mono" style={{color:"var(--green-600)"}}>{fmt(vuelto)}</span></div>}
        </div>
      </div>
      <div className="modal-foot">
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={!cubierto} onClick={()=>onConfirm(payments,vuelto)}>
          <Icon name="check" size={18}/>Confirmar venta
        </button>
      </div>
    </Modal>
  );
}

<script type="text/babel">
const { useState: useStateR, useMemo: useMemoR } = React;

function ReportsScreen() {
  const s = useStore();
  const [rango, setRango] = useStateR("7");

  const data = useMemoR(()=>{
    const days = parseInt(rango,10);
    const from = new Date(); from.setHours(0,0,0,0); from.setDate(from.getDate()-(days-1));
    const sales = s.sales.filter(v=>new Date(v.ts)>=from);
    const totalVendido = sales.reduce((a,v)=>a+v.total,0);
    const costoTotal = sales.reduce((a,v)=>a+v.items.reduce((b,it)=>b+it.costo*it.qty,0),0);
    const ganancia = totalVendido-costoTotal;
    const tickets = sales.length;
    const ticketProm = tickets?totalVendido/tickets:0;

    const byDay=[];
    for(let d=days-1;d>=0;d--){
      const day=new Date(); day.setHours(0,0,0,0); day.setDate(day.getDate()-d);
      const next=new Date(day); next.setDate(next.getDate()+1);
      const ds=sales.filter(v=>{const t=new Date(v.ts);return t>=day&&t<next;});
      byDay.push({
        label:days<=1?"Hoy":day.toLocaleDateString("es-AR",{day:"2-digit",month:days>14?undefined:"short"}).replace(".",""),
        value:ds.reduce((a,v)=>a+v.total,0),
      });
    }

    const byMethod={};
    sales.forEach(v=>v.payments.forEach(p=>{byMethod[p.method]=(byMethod[p.method]||0)+p.amount;}));

    const prod={};
    sales.forEach(v=>v.items.forEach(it=>{
      if(!prod[it.productId]) prod[it.productId]={nombre:it.nombre,qty:0,total:0};
      prod[it.productId].qty+=it.qty; prod[it.productId].total+=it.precio*it.qty;
    }));
    const top=Object.values(prod).sort((a,b)=>b.total-a.total).slice(0,6);
    return {totalVendido,ganancia,tickets,ticketProm,byDay,byMethod,top,costoTotal};
  },[s.sales,rango]);

  const methodLabels={efectivo:"Efectivo",tarjeta:"Tarjeta",qr:"QR / Billetera",transferencia:"Transferencia",fiado:"Fiado"};
  const methodIcon={efectivo:"cash",tarjeta:"card",qr:"qr",transferencia:"bank",fiado:"user"};
  const totalMethods=Object.values(data.byMethod).reduce((a,b)=>a+b,0)||1;

  return (
    <div className="reports-screen">
      <div className="row spread" style={{marginBottom:18}}>
        <div className="seg">
          {[["1","Hoy"],["7","7 días"],["30","30 días"]].map(([v,l])=>(
            <button key={v} className={"seg-btn"+(rango===v?" on":"")} onClick={()=>setRango(v)}>{l}</button>
          ))}
        </div>
        <button className="btn btn-ghost"><Icon name="download" size={18}/>Exportar</button>
      </div>
      <div className="kpi-grid" style={{marginBottom:20}}>
        <div className="kpi"><div className="kpi-label"><Icon name="cash"/>Ventas totales</div><div className="kpi-value mono">{fmt(data.totalVendido)}</div><div className="kpi-delta up">{data.tickets} tickets</div></div>
        <div className="kpi"><div className="kpi-label"><Icon name="coins"/>Ganancia estimada</div><div className="kpi-value mono">{fmt(data.ganancia)}</div><div className="kpi-delta up">{data.totalVendido?Math.round(data.ganancia/data.totalVendido*100):0}% margen</div></div>
        <div className="kpi"><div className="kpi-label"><Icon name="receipt"/>Ticket promedio</div><div className="kpi-value mono">{fmt(data.ticketProm)}</div></div>
        <div className="kpi"><div className="kpi-label"><Icon name="package"/>Costo de mercadería</div><div className="kpi-value mono">{fmt(data.costoTotal)}</div></div>
      </div>
      <div className="report-cols">
        <div className="card grow">
          <div className="card-head"><Icon name="chart" size={18}/><h3>Ventas por día</h3></div>
          <div className="card-pad"><BarChart data={data.byDay} height={220}/></div>
        </div>
        <div className="card" style={{width:320,flex:"0 0 320px"}}>
          <div className="card-head"><Icon name="card" size={18}/><h3>Por medio de pago</h3></div>
          <div className="card-pad col" style={{gap:14}}>
            {Object.keys(data.byMethod).length===0 && <div className="muted">Sin datos</div>}
            {Object.entries(data.byMethod).sort((a,b)=>b[1]-a[1]).map(([m,v])=>(
              <div key={m}>
                <div className="row spread" style={{marginBottom:6}}>
                  <span className="row gap-sm" style={{fontWeight:600,fontSize:13.5}}><Icon name={methodIcon[m]} size={16}/>{methodLabels[m]||m}</span>
                  <span className="mono" style={{fontWeight:700}}>{fmt(v)}</span>
                </div>
                <div className="bar-track"><div className="bar-fill" style={{width:(v/totalMethods*100)+"%"}}></div></div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <div className="card" style={{marginTop:20}}>
        <div className="card-head"><Icon name="tag" size={18}/><h3>Productos más vendidos</h3></div>
        <table className="table">
          <thead><tr><th>#</th><th>Producto</th><th className="num">Unidades</th><th className="num">Facturado</th></tr></thead>
          <tbody>
            {data.top.map((p,i)=>(
              <tr key={i}><td className="mono muted">{i+1}</td><td><strong>{p.nombre}</strong></td><td className="num mono">{p.qty}</td><td className="num mono"><strong>{fmt(p.total)}</strong></td></tr>
            ))}
            {data.top.length===0 && <tr><td colSpan="4"><div className="empty"><Icon name="chart"/><div>Aún no hay ventas en este período</div></div></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}
window.ReportsScreen = ReportsScreen;
</script>
