<script type="text/babel">
const { useState: useStateC, useEffect: useEffectC, useMemo: useMemoC } = React;

function CajaScreen({ pushToast }) {
  const s = useStore();
  const session = POS.currentSession();
  const [counts, setCounts] = useStateC({efectivo:"",tarjeta:"",qr:"",transferencia:""});
  const [done, setDone] = useStateC(null);

  const ventasSesion = useMemoC(()=>session?s.sales.filter(v=>v.sessionId===session.id):[], [s.sales,session]);
  const espera = useMemoC(()=>{
    const m={};
    ventasSesion.forEach(v=>v.payments.forEach(p=>{m[p.method]=(m[p.method]||0)+p.amount;}));
    return m;
  },[ventasSesion]);

  const esperaEfectivo=(espera.efectivo||0)+(session?session.openingAmount:0);
  const totalVendido=ventasSesion.reduce((a,v)=>a+v.total,0);

  async function cerrar(){
    const counted={
      efectivo:parseInt(counts.efectivo||0,10)||0,
      tarjeta:parseInt(counts.tarjeta||0,10)||0,
      qr:parseInt(counts.qr||0,10)||0,
      transferencia:parseInt(counts.transferencia||0,10)||0,
    };
    const res=await POS.closeSession(counted);
    if(res.ok){setDone(res.session);pushToast("Caja cerrada");}
  }

  const sesionesPrev=s.cashSessions.filter(x=>x.status==="cerrada").slice().reverse();

  if(!session){
    return(
      <div className="caja-screen">
        <div className="card card-pad" style={{maxWidth:460,margin:"0 auto",textAlign:"center"}}>
          <div className="recibo-check" style={{margin:"0 auto 16px"}}><Icon name="cash" size={28}/></div>
          <h3 style={{margin:"0 0 6px"}}>No hay una caja abierta</h3>
          <p className="muted" style={{marginTop:0}}>Abrí la caja con el monto inicial de efectivo para empezar a operar.</p>
          <AbrirCaja onOpen={function(monto){POS.openSession(monto).then(()=>pushToast("Caja abierta"));}}/>
        </div>
        {sesionesPrev.length>0 && <HistorialCajas sesiones={sesionesPrev}/>}
      </div>
    );
  }

  const filas=[
    {id:"efectivo",  label:"Efectivo",      esperado:esperaEfectivo, hint:"incluye fondo inicial "+fmt(session.openingAmount)},
    {id:"tarjeta",   label:"Tarjeta",        esperado:espera.tarjeta||0},
    {id:"qr",        label:"QR / Billetera", esperado:espera.qr||0},
    {id:"transferencia",label:"Transferencia",esperado:espera.transferencia||0},
  ];

  return(
    <div className="caja-screen">
      <div className="caja-cols">
        <div className="card grow">
          <div className="card-head"><Icon name="clock" size={18}/><h3>Sesión actual</h3>
            <span className="session-pill" style={{marginLeft:"auto"}}><span className="dot"></span>Abierta</span>
          </div>
          <div className="card-pad">
            <div className="caja-meta">
              <div><span className="muted">Cajero</span><strong>{session.cajero}</strong></div>
              <div><span className="muted">Apertura</span><strong>{fmtDate(session.openedAt,{day:"2-digit",month:"short"})} · {fmtTime(session.openedAt)}</strong></div>
              <div><span className="muted">Fondo inicial</span><strong className="mono">{fmt(session.openingAmount)}</strong></div>
              <div><span className="muted">Tickets</span><strong>{ventasSesion.length}</strong></div>
            </div>
            <hr className="hr"/>
            <div className="row spread" style={{fontSize:15}}>
              <span style={{fontWeight:700}}>Total vendido en la sesión</span>
              <span className="mono" style={{fontWeight:800,fontSize:22,color:"var(--green-700)"}}>{fmt(totalVendido)}</span>
            </div>
          </div>
        </div>

        <div className="card" style={{width:440,flex:"0 0 440px"}}>
          <div className="card-head"><Icon name="coins" size={18}/><h3>Arqueo de caja</h3></div>
          <div className="card-pad col" style={{gap:14}}>
            <div className="arqueo-head"><span>Medio</span><span className="right">Esperado</span><span className="right">Contado</span></div>
            {filas.map(f=>{
              return(
                <div className="arqueo-row" key={f.id}>
                  <div className="ar-label"><strong>{f.label}</strong>{f.hint&&<span className="muted">{f.hint}</span>}</div>
                  <div className="ar-exp mono">{fmt(f.esperado)}</div>
                  <div className="disc-input"><span className="mono">$</span>
                    <input className="mono" value={counts[f.id]} placeholder="0"
                      onChange={e=>setCounts(c=>({...c,[f.id]:e.target.value.replace(/\D/g,"")}))}/>
                  </div>
                </div>
              );
            })}
            <hr className="hr"/>
            {(()=>{
              const diffEf=(parseInt(counts.efectivo||0,10)||0)-esperaEfectivo;
              return(
                <div className="row spread">
                  <span style={{fontWeight:700}}>Diferencia en efectivo</span>
                  <span className="mono" style={{fontWeight:800,fontSize:18,color:diffEf===0?"var(--green-600)":diffEf>0?"var(--info)":"var(--danger)"}}>
                    {diffEf>0?"+":""}{fmt(diffEf)}
                  </span>
                </div>
              );
            })()}
            <button className="btn btn-primary btn-lg btn-block" onClick={cerrar}><Icon name="check" size={20}/>Cerrar caja</button>
          </div>
        </div>
      </div>

      {sesionesPrev.length>0 && <HistorialCajas sesiones={sesionesPrev}/>}

      <Modal open={!!done} onClose={()=>setDone(null)} max={420}>
        {done&&(
          <div className="recibo">
            <div className="recibo-check"><Icon name="check" size={30}/></div>
            <div className="recibo-title">Caja cerrada</div>
            <div className="recibo-amount mono">{fmt(done.totalVendido)}</div>
            <div className="muted">{done.ticketCount} tickets · {fmtDate(done.closedAt)} {fmtTime(done.closedAt)}</div>
            <div className="recibo-ticket">
              <div className="rt-line"><span>Esperado en efectivo</span><span className="mono">{fmt(done.expectedEfectivo)}</span></div>
              <div className="rt-line"><span>Contado</span><span className="mono">{fmt(done.counted.efectivo)}</span></div>
              <div className="rt-total"><span>DIFERENCIA</span><span className="mono" style={{color:done.difference===0?"var(--green-600)":"var(--danger)"}}>{done.difference>0?"+":""}{fmt(done.difference)}</span></div>
            </div>
          </div>
        )}
        <div className="modal-foot">
          <button className="btn btn-ghost" onClick={()=>window.print()}><Icon name="receipt" size={18}/>Imprimir Z</button>
          <button className="btn btn-primary" onClick={()=>setDone(null)}>Listo</button>
        </div>
      </Modal>
    </div>
  );
}
window.CajaScreen = CajaScreen;

function AbrirCaja({ onOpen }) {
  const [monto, setMonto] = useStateC("10000");
  return(
    <div className="row gap-sm" style={{justifyContent:"center",marginTop:16}}>
      <div className="disc-input" style={{fontSize:16}}><span className="mono">$</span>
        <input className="mono" value={monto} onChange={e=>setMonto(e.target.value.replace(/\D/g,""))} style={{width:110}}/>
      </div>
      <button className="btn btn-primary" onClick={()=>onOpen(parseInt(monto||0,10)||0)}><Icon name="cash" size={18}/>Abrir caja</button>
    </div>
  );
}

function HistorialCajas({ sesiones }) {
  return(
    <div className="card" style={{marginTop:20}}>
      <div className="card-head"><Icon name="receipt" size={18}/><h3>Cierres anteriores</h3></div>
      <table className="table">
        <thead><tr><th>Fecha</th><th>Cajero</th><th className="num">Tickets</th><th className="num">Vendido</th><th className="num">Diferencia</th></tr></thead>
        <tbody>
          {sesiones.map(x=>(
            <tr key={x.id}>
              <td>{fmtDate(x.closedAt,{day:"2-digit",month:"short"})} · {fmtTime(x.closedAt)}</td>
              <td>{x.cajero}</td>
              <td className="num mono">{x.ticketCount}</td>
              <td className="num mono"><strong>{fmt(x.totalVendido)}</strong></td>
              <td className="num mono" style={{color:x.difference===0?"var(--green-600)":"var(--danger)"}}>{x.difference>0?"+":""}{fmt(x.difference)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}
</script>

<!-- ADMIN -->
<script type="text/babel">
const { useState: useStateA, useEffect: useEffectA } = React;

function AdminScreen({ pushToast }) {
  const s = useStore();
  const [tab, setTab] = useStateA("resumen");
  return(
    <div className="admin-screen">
      <div className="seg" style={{marginBottom:18}}>
        {[["resumen","Resumen"],["negocio","Datos del negocio"],["usuarios","Usuarios"],["sistema","Sistema"]].map(([v,l])=>(
          <button key={v} className={"seg-btn"+(tab===v?" on":"")} onClick={()=>setTab(v)}>{l}</button>
        ))}
      </div>
      {tab==="resumen"&&<AdminResumen s={s}/>}
      {tab==="negocio"&&<AdminNegocio s={s} pushToast={pushToast}/>}
      {tab==="usuarios"&&<AdminUsuarios s={s}/>}
      {tab==="sistema"&&<AdminSistema pushToast={pushToast}/>}
    </div>
  );
}
window.AdminScreen = AdminScreen;

function AdminResumen({ s }) {
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const ventasHoy=s.sales.filter(v=>new Date(v.ts)>=hoy);
  const totalHoy=ventasHoy.reduce((a,v)=>a+v.total,0);
  const bajos=s.products.filter(p=>p.stock<=p.minStock);
  const valorInv=s.products.reduce((a,p)=>a+p.costo*p.stock,0);
  const session=POS.currentSession();
  return(
    <div className="col" style={{gap:20}}>
      <div className="kpi-grid">
        <div className="kpi"><div className="kpi-label"><Icon name="cash"/>Ventas de hoy</div><div className="kpi-value mono">{fmt(totalHoy)}</div><div className="kpi-delta up">{ventasHoy.length} tickets</div></div>
        <div className="kpi"><div className="kpi-label"><Icon name="package"/>Productos activos</div><div className="kpi-value">{s.products.length}</div></div>
        <div className="kpi"><div className="kpi-label"><Icon name="alert"/>Necesitan reposición</div><div className="kpi-value" style={{color:bajos.length?"var(--warn)":"var(--ink)"}}>{bajos.length}</div></div>
        <div className="kpi"><div className="kpi-label"><Icon name="coins"/>Valor inventario</div><div className="kpi-value mono">{fmt(valorInv)}</div></div>
      </div>
      <div className="report-cols">
        <div className="card grow">
          <div className="card-head"><Icon name="alert" size={18}/><h3>Reposición pendiente</h3>
            {bajos.length>0&&<span className="badge low" style={{marginLeft:"auto"}}>{bajos.length}</span>}
          </div>
          <div className="scroll" style={{maxHeight:320}}>
            {bajos.length===0&&<div className="empty"><Icon name="check"/><div>Todo el stock está en orden</div></div>}
            {bajos.map(p=>(
              <div className="repo-row" key={p.id}>
                <div><strong>{p.nombre}</strong><div className="muted" style={{fontSize:12.5}}>Mínimo: {p.minStock} {p.unidad}</div></div>
                <StockBadge p={p}/>
                <span className="mono" style={{fontWeight:700,width:60,textAlign:"right"}}>{p.stock} {p.unidad}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="card" style={{width:340,flex:"0 0 340px"}}>
          <div className="card-head"><Icon name="clock" size={18}/><h3>Estado de caja</h3></div>
          <div className="card-pad">
            {session?(
              <div className="col" style={{gap:12}}>
                <span className="session-pill"><span className="dot"></span>Caja abierta · {session.cajero}</span>
                <div className="row spread"><span className="muted">Desde</span><strong>{fmtTime(session.openedAt)}</strong></div>
                <div className="row spread"><span className="muted">Fondo inicial</span><strong className="mono">{fmt(session.openingAmount)}</strong></div>
                <div className="row spread"><span className="muted">Vendido</span><strong className="mono">{fmt(s.sales.filter(v=>v.sessionId===session.id).reduce((a,v)=>a+v.total,0))}</strong></div>
              </div>
            ):<div className="empty"><Icon name="cash"/><div>No hay caja abierta</div></div>}
          </div>
        </div>
      </div>
    </div>
  );
}

function AdminNegocio({ s, pushToast }) {
  const [form, setForm] = useStateA(s.settings);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  return(
    <div className="card" style={{maxWidth:640}}>
      <div className="card-head"><Icon name="settings" size={18}/><h3>Datos del negocio</h3></div>
      <div className="card-pad col" style={{gap:14}}>
        <div className="field"><label>Nombre del comercio</label><input className="input" value={form.negocio} onChange={e=>set("negocio",e.target.value)}/></div>
        <div className="row" style={{gap:14}}>
          <div className="field grow"><label>CUIT</label><input className="input mono" value={form.cuit} onChange={e=>set("cuit",e.target.value)}/></div>
          <div className="field grow"><label>Moneda</label><input className="input" value={form.moneda} disabled/></div>
        </div>
        <div className="field"><label>Dirección</label><input className="input" value={form.direccion} onChange={e=>set("direccion",e.target.value)}/></div>
        <div className="field"><label>Pie de ticket</label><input className="input" value={form.ticketFooter} onChange={e=>set("ticketFooter",e.target.value)}/></div>
        <div className="row" style={{justifyContent:"flex-end"}}>
          <button className="btn btn-primary" onClick={()=>{POS.updateSettings(form);pushToast("Datos guardados");}}><Icon name="check" size={18}/>Guardar cambios</button>
        </div>
      </div>
    </div>
  );
}

function AdminUsuarios({ s }) {
  return(
    <div className="card" style={{maxWidth:640}}>
      <div className="card-head"><Icon name="user" size={18}/><h3>Usuarios del sistema</h3>
        <button className="btn btn-ghost btn-sm" style={{marginLeft:"auto"}}><Icon name="plus" size={16}/>Agregar</button>
      </div>
      <table className="table">
        <thead><tr><th>Usuario</th><th>Rol</th><th>PIN</th><th></th></tr></thead>
        <tbody>
          {s.users.map(u=>(
            <tr key={u.id}>
              <td><div className="row gap-sm"><span className="avatar" style={{width:30,height:30,fontSize:13}}>{u.inicial}</span><strong>{u.nombre}</strong></div></td>
              <td><span className={"badge "+(u.rol==="Administrador"?"ok":"info")}>{u.rol}</span></td>
              <td className="mono muted">••••</td>
              <td className="right"><button className="icon-btn"><Icon name="edit" size={17}/></button></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function AdminSistema({ pushToast }) {
  return(
    <div className="card" style={{maxWidth:640}}>
      <div className="card-head"><Icon name="settings" size={18}/><h3>Datos del sistema</h3></div>
      <div className="card-pad col" style={{gap:16}}>
        <p className="muted" style={{margin:0}}>Los datos se guardan en este navegador (localStorage). Podés reiniciar todo a los datos de demostración.</p>
        <div className="row gap-sm">
          <button className="btn btn-danger" onClick={()=>{if(confirm("¿Reiniciar todos los datos? Se perderán ventas y cambios.")){POS.resetAll();pushToast("Datos reiniciados");}}}>
            <Icon name="trash" size={17}/>Reiniciar datos de demo
          </button>
        </div>
      </div>
    </div>
  );
}
</script>

<!-- APP SHELL -->
<script type="text/babel">
const { useState: useStateApp } = React;

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (this.state.error) return (
      <div style={{padding:32,fontFamily:"monospace",background:"#fff0f0",minHeight:"100vh"}}>
        <div style={{fontWeight:700,fontSize:18,color:"#c00",marginBottom:12}}>💥 Error en el POS</div>
        <pre style={{fontSize:12,color:"#333",whiteSpace:"pre-wrap",wordBreak:"break-all",background:"#fff",padding:16,borderRadius:8,border:"1px solid #fcc"}}>
          {String(this.state.error)+" -- "+(this.state.error.stack||"")}</pre>
        <button onClick={()=>this.setState({error:null})} style={{marginTop:12,padding:"8px 16px",background:"#1F8A5B",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700}}>
          Reintentar
        </button>
      </div>
    );
    return this.props.children;
  }
}

function App() {
  const s = useStore();
  const [route, setRoute] = useStateApp("venta");
  const [pushToast, toastNode] = useToasts();
  const now = useClock();

  if (s.loading) return (
    <div style={{height:"100vh",display:"grid",placeItems:"center",background:"var(--bg)"}}>
      <div style={{textAlign:"center"}}>
        <div style={{width:52,height:52,border:"4px solid var(--line)",borderTopColor:"var(--green-600)",borderRadius:"50%",animation:"spin .7s linear infinite",margin:"0 auto 20px"}}></div>
        <div style={{fontWeight:700,fontSize:16,color:"var(--ink)"}}>Cargando negocio…</div>
        <div style={{color:"var(--muted)",fontSize:13,marginTop:6}}>{NEGOCIO_SLUG || 'Verificando acceso'}</div>
      </div>
      <style>{"@keyframes spin{to{transform:rotate(360deg)}}"}</style>
    </div>
  );

  if (s.error) return (
    <div style={{height:"100vh",display:"grid",placeItems:"center",background:"var(--bg)"}}>
      <div style={{textAlign:"center",maxWidth:400,padding:24}}>
        <div style={{fontSize:48,marginBottom:16}}>⚠️</div>
        <div style={{fontWeight:800,fontSize:20,color:"var(--ink)",marginBottom:8}}>Negocio no disponible</div>
        <div style={{color:"var(--muted)",fontSize:14,marginBottom:20}}>{s.error}</div>
        <div style={{background:"var(--surface-2)",border:"1px solid var(--line)",borderRadius:10,padding:"12px 16px",fontFamily:"var(--mono)",fontSize:12,color:"var(--muted)",textAlign:"left"}}>
          URL esperada: <strong>pos.tudominio.com?n=nombre-del-negocio</strong>
        </div>
      </div>
    </div>
  );

  if (!s.user) return (<><LoginScreen onLogged={()=>setRoute("venta")}/>{toastNode}</>);

  const bajos = s.products.filter(p=>p.stock<=p.minStock).length;
  const session = POS.currentSession();

  const nav=[
    {id:"venta",    label:"Venta",            icon:"cart"},
    {id:"stock",    label:"Control de stock",  icon:"box", badge:bajos||null},
    {id:"reportes", label:"Reportes",          icon:"chart"},
    {id:"caja",     label:"Cierre de caja",    icon:"cash"},
    {id:"admin",    label:"Administración",    icon:"shield"},
  ];
  const titles={
    venta:    ["Venta","Punto de venta · escaneá o buscá productos"],
    stock:    ["Control de stock","Inventario y reposición"],
    reportes: ["Reportes de ventas","Análisis del negocio"],
    caja:     ["Cierre de caja","Arqueo y control de efectivo"],
    admin:    ["Administración","Configuración y resumen general"],
  };

  return(
    <div className="app">
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-mark">{(s.settings.negocio||"M")[0]}</div>
          <div><div className="brand-name">{s.settings.negocio}</div><div className="brand-sub">Punto de venta</div></div>
        </div>
        <nav className="nav">
          <div className="nav-section">Operación</div>
          {nav.slice(0,4).map(n=>(
            <button key={n.id} className={"nav-item"+(route===n.id?" active":"")} onClick={()=>setRoute(n.id)}>
              <Icon name={n.icon}/>{n.label}{n.badge?<span className="nav-badge">{n.badge}</span>:null}
            </button>
          ))}
          <div className="nav-section">Gestión</div>
          {nav.slice(4).map(n=>(
            <button key={n.id} className={"nav-item"+(route===n.id?" active":"")} onClick={()=>setRoute(n.id)}>
              <Icon name={n.icon}/>{n.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-foot col gap-sm">
          <div className="user-chip">
            <span className="avatar">{s.user.inicial}</span>
            <div className="grow"><div className="user-name">{s.user.nombre}</div><div className="user-role">{s.user.rol}</div></div>
            <button className="icon-btn" title="Cerrar sesión" onClick={()=>POS.logout()}><Icon name="logout" size={18}/></button>
          </div>
        </div>
      </aside>

      <main className="main">
        <header className="topbar">
          <div><h1>{titles[route][0]}</h1></div>
          <div className="topbar-right">
            {session
              ? <span className="session-pill"><span className="dot"></span>Caja abierta</span>
              : <span className="session-pill" style={{background:"var(--warn-bg)",color:"var(--warn)"}}><span className="dot" style={{background:"var(--warn)",boxShadow:"none"}}></span>Caja cerrada</span>}
            <span className="clock mono">{fmtDate(now,{weekday:"short",day:"2-digit",month:"short"})} · {fmtTime(now)}</span>
          </div>
        </header>
        <div className={"content"+(route==="venta"?" flush":"")}>
          {route==="venta"    && <VentaScreen pushToast={pushToast}/>}
          {route==="stock"    && <StockScreen pushToast={pushToast}/>}
          {route==="reportes" && <ReportsScreen/>}
          {route==="caja"     && <CajaScreen pushToast={pushToast}/>}
          {route==="admin"    && <AdminScreen pushToast={pushToast}/>}
        </div>
      </main>
      {toastNode}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
